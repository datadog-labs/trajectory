name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON metadata
        run: |
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path(".")
          json_paths = [
              ".agents/plugins/marketplace.json",
              ".claude-plugin/marketplace.json",
              "RELEASES.json",
              "contracts/public-release-mirror-v1.json",
              "gemini-extension.json",
              "plugin/trajectory/.claude-plugin/plugin.json",
              "plugin/trajectory/.mcp.json",
              "plugin/trajectory-codex/.codex-plugin/plugin.json",
              "plugin/trajectory-codex/.mcp.json",
              "plugin/trajectory-codex/hooks.json",
              "plugin/trajectory-pi/package.json",
              "plugin/trajectory-pi/package-lock.json",
              "plugin/trajectory-pi/tsconfig.json",
              "plugin/trajectory-opencode/package.json",
          ]

          for rel in json_paths:
              with (root / rel).open(encoding="utf-8") as handle:
                  json.load(handle)

          releases = json.loads((root / "RELEASES.json").read_text(encoding="utf-8"))
          unexpected = set(releases) - {"stable", "beta"}
          if unexpected:
              raise SystemExit(f"unexpected release channels: {sorted(unexpected)}")

          installer = (root / "install.sh").read_text(encoding="utf-8")
          latest_asset_url = "https://github.com/$REPO/releases/latest/download/$asset"
          if latest_asset_url not in installer:
              raise SystemExit("installer must download from the public latest-release asset URL")
          for forbidden in ("api.github.com", "GH_TOKEN", "GITHUB_TOKEN", "python3"):
              if forbidden in installer:
                  raise SystemExit(f"public installer must not depend on {forbidden}")
          if "Download attempt $attempt of 3 failed" not in installer:
              raise SystemExit("public installer must retain bounded download retries")
          if '$SCRIPT_DIR/intercepts/$asset' not in installer:
              raise SystemExit("public installer must stage top-level intercept assets")
          if "main/intercepts/$asset" not in installer:
              raise SystemExit("public installer must download top-level intercept assets")
          if "trajectory/intercepts/$asset" in installer:
              raise SystemExit("public installer must not use the source-repository intercept path")
          PY
      - name: Validate protected release publication
        run: |
          python3 -m py_compile \
            .github/scripts/public_release_mirror.py \
            tests/test_public_release_mirror.py
          python3 .github/scripts/public_release_mirror.py validate-contract \
            --contract contracts/public-release-mirror-v1.json
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Parse workflow and policy YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' \
            .github/workflows/*.yml \
            .github/chainguard/*.yaml
      - name: Validate shell syntax
        run: bash -n install.sh uninstall.sh
