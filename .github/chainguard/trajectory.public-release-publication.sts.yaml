  job_workflow_ref: DataDog/trajectory/\.github/workflows/public-release-publication\.yml@(refs/tags/release-ci-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta(\.[1-9][0-9]*)?)?-[0-9a-f]{9,40}|refs/heads/main)

